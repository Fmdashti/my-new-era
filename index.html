<style>
/* Layout: a light-pink princess cover with a gold crown and twinkling sparkles, then three parts of tiles; every section opens as its own page under a sticky header. Soft pink everywhere, no purple. */
:root{
  --paper:#FFF7FA;
  --surface:#FFFFFF;
  --sunk:#FDEBF2;
  --ink:#3F2C33;
  --muted:#97767F;
  --line:#F8DCE7;
  --accent:#EE6FA4;
  --accent-ink:#C2457A;
  --shine:#D4A645;
  --btn:#F9BBD3;
  --btn-ink:#3F2C33;
  --red:#E0445A;
  --green:#2FA36B;
  --on-solid:#FFFFFF;
  --cover-a:#FFEAF2;
  --cover-b:#FFCFE1;
  --cover-ink:#C2457A;
  --cover-muted:#A8707F;
  --cover-shine:#B8862A;
  --health:#2E9C84;
  --beauty:#E0598F;
  --religion:#B7832A;
  --relationship:#E0684A;
  --career:#3A78C2;
  --book1:#E0679A; --book2:#C9566F; --book3:#EE8A7E; --book4:#D9A441; --book5:#5FAE9A; --book6:#E98BAE;
  --book-ink:#FFFFFF;
  --font-script:"Great Vibes", "Snell Roundhand", "Apple Chancery", cursive;
  --font-display:"Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-hand:"Kalam", "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1D1316; --surface:#2A1C21; --sunk:#36262C; --ink:#FDEDF2; --muted:#D3AEBB; --line:#4A333B;
    --accent:#F59BC0; --accent-ink:#F8B4CF; --shine:#EBC56E; --btn:#F59BC0; --btn-ink:#1D1316;
    --red:#F4677A; --green:#55CC8E; --on-solid:#1D1316;
    --cover-a:#3A242C; --cover-b:#57303F; --cover-ink:#FFC9DD; --cover-muted:#E3B4C5; --cover-shine:#F0CB74;
    --health:#5CCBB0; --beauty:#F59BC0; --religion:#E8BC66; --relationship:#F59A7A; --career:#7DB0EE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1D1316; --surface:#2A1C21; --sunk:#36262C; --ink:#FDEDF2; --muted:#D3AEBB; --line:#4A333B;
  --accent:#F59BC0; --accent-ink:#F8B4CF; --shine:#EBC56E; --btn:#F59BC0; --btn-ink:#1D1316;
  --red:#F4677A; --green:#55CC8E; --on-solid:#1D1316;
  --cover-a:#3A242C; --cover-b:#57303F; --cover-ink:#FFC9DD; --cover-muted:#E3B4C5; --cover-shine:#F0CB74;
  --health:#5CCBB0; --beauty:#F59BC0; --religion:#E8BC66; --relationship:#F59A7A; --career:#7DB0EE;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
body.home::before{background:var(--cover-a)}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cover */
.cover{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--cover-a) 0%,var(--cover-b) 100%);color:var(--cover-ink);border-radius:0 0 28px 28px}
.spk{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.spk i{position:absolute;width:var(--s);height:var(--s);background:var(--cover-shine);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:tw 3.4s ease-in-out infinite;animation-delay:var(--d)}
.spk i.w{background:#FFFFFF;opacity:.9}
@keyframes tw{0%,100%{transform:scale(1) rotate(0);opacity:.95}50%{transform:scale(.55) rotate(20deg);opacity:.45}}
.cover-in{position:relative;z-index:1;padding-block:20px 34px}
.cover-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--cover-muted);font-weight:600}
.crown{display:block;width:62px;height:44px;margin:22px 0 -8px 10px;transform:rotate(-12deg)}
.crown .c1{fill:var(--cover-shine)}
.crown .c2{fill:var(--accent)}
.crown .c3{fill:#FFFFFF}
.cover h1{font-family:var(--font-script);font-weight:400;font-size:clamp(64px,19vw,124px);line-height:1;margin:0 0 6px;text-wrap:balance}
.cover h1 span{color:var(--cover-shine)}
.hello{margin:0;font-size:17px;max-width:36ch;font-weight:500}
.era{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin-top:12px}
.era-n{font-family:var(--font-script);font-size:44px;line-height:1;color:var(--cover-ink)}
.era-t{color:var(--cover-muted);font-size:14px;font-weight:500}
.era-set{margin-top:18px;background:color-mix(in srgb,var(--surface) 55%,transparent);border:1px solid var(--cover-ink);color:var(--cover-ink);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px}
.cover .save{color:var(--cover-muted);text-transform:none;letter-spacing:0}
.top-r{display:inline-flex;align-items:center;gap:10px}
.theme-b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--accent-ink);padding:0;flex:none}
.theme-b svg{width:19px;height:19px}
.cover .theme-b{background:color-mix(in srgb,var(--surface) 60%,transparent);border-color:transparent;color:var(--cover-ink)}

/* Home parts */
.part{padding-block:30px 0}
.part.last{padding-bottom:56px}
.part-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:0 0 14px}
.part-no{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent-ink)}
.part-t{font-family:var(--font-script);font-weight:400;font-size:38px;line-height:1.05;margin:0;color:var(--accent-ink)}
.part-no{display:inline-flex;align-items:center;gap:6px}
.part-no::before{content:"";width:11px;height:11px;background:var(--shine);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.tiles.me{grid-template-columns:repeat(5,minmax(0,1fr))}.tiles.new{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:128px;transition:border-color .15s,transform .15s;color:var(--ink)}
.tile:hover{border-color:var(--accent)}
.tile:active{transform:scale(.985)}
.tile .ic{width:26px;height:26px;color:var(--accent);flex:none;background:color-mix(in srgb,var(--accent) 12%,transparent);box-sizing:content-box;padding:8px;border-radius:50%}
.tile-t{display:block;font-weight:600;font-size:15px;line-height:1.25}
.tile-s{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:auto;font-size:12.5px;line-height:1.35;color:var(--muted)}
.grow-tile{flex-direction:row;align-items:center;gap:18px;min-height:0;padding:18px;width:100%}
.grow-tile .gt{display:flex;flex-direction:column;gap:4px;min-width:0}
.grow-tile .tile-s{margin-top:0}
.mini{display:flex;align-items:center;gap:2px;flex:none}
.mini i{width:34px;height:34px;border-radius:50%;border:3.5px solid var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}
.mini i.g{border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
.mini .arr{width:44px;height:18px}

/* Page chrome */
.ph{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--paper);border-bottom:1px solid var(--line)}
.ph-in{display:flex;align-items:center;gap:8px;padding-block:6px;min-height:52px}
.back{display:inline-flex;align-items:center;gap:2px;background:none;border:0;color:var(--accent-ink);font-weight:600;font-size:15px;padding:8px 8px 8px 2px;margin-left:-4px;border-radius:8px}
.back svg{width:20px;height:20px}
.save{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--green)} .dot.wait{background:var(--accent)} .dot.bad{background:var(--red)}
.hero{padding-block:24px 6px}
.hero h2{font-family:var(--font-display);font-weight:700;font-size:clamp(30px,8vw,44px);line-height:1.05;margin:0 0 8px;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:62ch}
.body{padding-block:18px 80px}
.narrow{max-width:720px}
.meta{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.meta b{color:var(--ink);font-weight:600}

/* Forms and buttons */
.in{display:block;width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px;line-height:1.4;color:var(--ink)}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.in::placeholder{color:var(--muted);opacity:.75}
textarea.in{resize:none;overflow:hidden}
.btn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--btn);color:var(--btn-ink);border:0;border-radius:999px;padding:0 20px;min-height:46px;font-weight:600;font-size:15px;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 22%,transparent)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;box-shadow:none}
.btn.danger{background:var(--red);color:var(--on-solid)}
.btn svg{width:18px;height:18px}
.link{background:none;border:0;padding:6px 2px;color:var(--muted);font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.add{display:flex;gap:8px;margin:0 0 16px}
.add-row{display:flex;width:100%;justify-content:center;margin-top:14px;padding:12px;border:1.5px dashed var(--line);border-radius:12px;background:transparent;color:var(--accent-ink);font-weight:600}
.add-row:hover{border-color:var(--accent)}
.form{display:grid;gap:20px;max-width:640px}
.fld{display:flex;flex-direction:column;gap:7px;min-width:0}
.lbl{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.words{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.words .in{font-family:var(--font-display);font-weight:700;font-size:20px;text-align:center;padding-inline:6px}

/* Lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 6px 12px 14px}
.item-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.f{display:block;width:100%;min-width:0;border:0;border-bottom:1px solid transparent;background:transparent;padding:2px 0;border-radius:0;resize:none;outline:none;overflow:hidden;color:var(--ink)}
.f:focus{border-bottom-color:var(--accent)}
.f::placeholder{color:var(--muted);opacity:.7}
.f-main{font-size:17px;font-weight:500;line-height:1.4}
.f-note{font-family:var(--font-hand);font-size:17.5px;line-height:1.35;color:var(--muted)}
.f-line{font-size:16px;color:var(--muted)}
.f-date{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:2px}
.f-date .f{width:auto;font-size:16px;padding:0}
.done .f-main{text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:2px;color:var(--muted)}
.check{flex:none;width:28px;height:28px;margin-top:1px;border-radius:50%;border:2px solid color-mix(in srgb,var(--muted) 60%,transparent);background:transparent;display:grid;place-items:center;padding:0;transition:background .15s,border-color .15s}
.check svg{width:15px;height:15px;stroke:var(--on-solid);opacity:0}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.check[aria-pressed="true"] svg{opacity:1}
.x{flex:none;width:34px;height:34px;display:grid;place-items:center;border:0;background:transparent;border-radius:50%;color:var(--muted);padding:0;opacity:.75}
.x:hover{background:var(--sunk);opacity:1;color:var(--red)}
.x svg{width:16px;height:16px}
.num{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.35;color:var(--accent-ink);min-width:30px;text-align:right}
.bullet{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:10px}
.bk{width:38px;height:54px;border-radius:2px 5px 5px 2px;background:var(--bc);color:var(--book-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:22px;box-shadow:inset 4px 0 0 rgba(0,0,0,.2)}
.dblk{display:flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:50px;border-radius:10px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent-ink);line-height:1}
.dblk b{font-family:var(--font-display);font-weight:700;font-size:24px}
.dblk span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;margin-top:3px;font-weight:700}
.dblk svg{width:20px;height:20px}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 18px;color:var(--muted);text-align:center;font-size:14.5px}
.ideas{margin-top:20px}
.ideas-l{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:transparent;border:1px dashed color-mix(in srgb,var(--accent) 75%,transparent);border-radius:999px;padding:7px 13px;font-size:14px;color:var(--ink)}
.chip:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.chip::before{content:"+ ";color:var(--accent-ink);font-weight:700}

/* Routine */
.dawn{position:relative;padding:6px 20px 0;margin:0 0 4px}
.dawn-track{position:relative;height:10px;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 25%,transparent),var(--shine) 45%,var(--accent))}
.slot-h{margin:22px 0 2px;font-family:var(--font-script);font-size:28px;line-height:1.1;color:var(--accent-ink)}
.slot-h:first-child{margin-top:6px}
.dd{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);background:var(--paper);border:2px solid var(--ink)}
.dd.on{background:var(--ink);border-color:var(--paper)}
.ticks{position:relative;height:22px;margin-top:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.slots{display:flex;flex-direction:column}
.slot{display:grid;grid-template-columns:106px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.slot.on .f-main{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent)}
.tm::-webkit-calendar-picker-indicator{display:none}
.tm{width:100%;min-width:0;border:0;background:var(--sunk);border-radius:8px;padding:6px 8px;font-size:16px;font-weight:600;color:var(--accent-ink);font-variant-numeric:tabular-nums}

/* Habit */
.habits{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.habit{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.habit.ghost{opacity:.6;border-style:dashed;max-width:520px}
.habit-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.habit-id{min-width:0;flex:1}
.ghost-name{font-size:17px;font-weight:500;margin:0}
.habit-meta{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;font-size:13px;color:var(--muted);margin-top:4px}
.habit-meta label{display:inline-flex;gap:6px;align-items:center}
.habit-meta .f{width:auto;font-size:16px;padding:0;color:var(--muted)}
.habit-count{font-family:var(--font-display);text-align:right;line-height:1;flex:none;white-space:nowrap}
.habit-count b{font-weight:700;font-size:44px;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.habit-count span{font-size:18px;color:var(--muted)}
.bar{height:6px;border-radius:999px;background:var(--sunk);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .25s}
.boxes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin-top:14px}
.box{aspect-ratio:1;max-width:100%;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:10px;background:transparent;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0;transition:background .15s,border-color .15s}
.box.on{background:var(--accent);border-color:var(--accent);color:var(--on-solid)}
.box svg{width:18px;height:18px}
.box.today{outline:2px solid var(--ink);outline-offset:2px}
.won{margin:14px 0 0;font-family:var(--font-script);font-size:28px;line-height:1.2;color:var(--accent-ink)}
.habit-foot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px;font-size:14px}

/* Wishlist */
.wish-form{display:grid;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:640px;margin-bottom:24px}
.wish-form .btn{justify-self:start}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg-b{border:1.5px solid color-mix(in srgb,var(--c) 50%,transparent);color:var(--c);background:transparent;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.seg-b.on{background:var(--c);border-color:var(--c);color:var(--on-solid)}
.rate{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap}
.stars{display:flex;gap:0}
.st{width:32px;height:32px;display:grid;place-items:center;border:0;background:transparent;padding:0}
.st svg{width:21px;height:21px;fill:transparent;stroke:var(--shine);stroke-width:1.6;stroke-linejoin:round}
.st.on svg{fill:var(--shine)}
.stars.lg .st{width:42px;height:42px}
.stars.lg .st svg{width:29px;height:29px}
.star-word{font-family:var(--font-hand);font-size:19px;color:var(--accent-ink)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filt{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--ink)}
.filt span{color:var(--muted);font-weight:500;margin-left:3px;font-variant-numeric:tabular-nums}
.filt.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.filt.on span{color:inherit;opacity:.7}
.wishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.wish{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px 14px 14px;min-width:0}
.wish.bought{opacity:.62}
.wish-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cat-wrap{position:relative;display:inline-flex}
.cat-wrap::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:2px solid var(--c);border-bottom:2px solid var(--c);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.cat{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);font-weight:600;font-size:14px;padding:5px 30px 5px 12px}
.tgl{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--ink);margin-top:4px}
.tgl svg{width:14px;height:14px}
.tgl.on{background:var(--green);border-color:var(--green);color:var(--on-solid)}

/* Months (career + hobbies) */
.yearbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.yb{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:50%;padding:0;color:var(--ink)}
.yb svg{width:18px;height:18px}
.yr{font-family:var(--font-display);font-weight:700;font-size:30px;min-width:78px;text-align:center;font-variant-numeric:tabular-nums}
.tsums{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.tsum{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 5px}
.tsum b{min-width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);font-size:12.5px;font-variant-numeric:tabular-nums}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:12px}
.month{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.month.cur{border:2px solid var(--accent);padding:13px}
.mh{display:flex;align-items:center;gap:8px}
.mh h3{margin:0;font-family:var(--font-script);font-weight:400;font-size:30px;line-height:1.1;color:var(--accent-ink)}
.tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:999px;padding:3px 8px}
.mc{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0 4px;border-top:1px dashed var(--line)}
.ttype{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.madd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;margin-top:auto;padding-top:6px}
.msel,.min{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:16px;min-width:0;color:var(--ink)}
.msel{font-size:14px;max-width:132px}
.madd .btn{width:42px;padding:0}
.tsum-new{border:1.5px dashed var(--accent);color:var(--accent-ink);background:transparent;font-weight:600;padding:4px 13px 4px 9px;cursor:pointer}
.tsum-new svg{width:16px;height:16px}
.tsum-add{padding:3px 4px 3px 12px;border-color:var(--accent)}
.tsum-add input{border:0;background:transparent;font-size:16px;width:150px;min-width:0;outline:none;color:var(--ink);padding:0}
.tsum-ok,.tsum-x{width:26px;height:26px;border-radius:50%;border:0;display:grid;place-items:center;padding:0;background:transparent;color:var(--muted);flex:none}
.tsum-ok{background:var(--btn);color:var(--btn-ink)}
.tsum-ok svg,.tsum-x svg{width:13px;height:13px}
.tsum .tsum-x{margin:0 -6px 0 -2px}
.hob .tgl{margin-top:2px}

/* Challenges to Achievements */
.ca{max-width:600px;margin:0 auto}
.ca-head,.ca-row{display:grid;grid-template-columns:minmax(0,1fr) 62px minmax(0,1fr);align-items:end;column-gap:4px}
.ca-col{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.ca-label{font-family:var(--font-script);font-size:clamp(30px,8.5vw,42px);line-height:1.1;text-align:center}
.ca-label.r{color:var(--red)}
.ca-label.g{color:var(--green)}
.circ{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;border:4px solid var(--red);background:color-mix(in srgb,var(--red) 13%,transparent);padding:0;flex:none;color:var(--on-solid)}
.circ.big{width:84px;height:84px;border-width:5px}
.circ.g{border-color:var(--green);background:color-mix(in srgb,var(--green) 10%,transparent)}
.circ.g.on{background:var(--green)}
.circ svg{width:26px;height:26px}
.circ.big svg{width:34px;height:34px}
.ca-mid{align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:0}
.arr-box{height:58px;display:grid;place-items:center}
.ca-head .arr-box{height:84px}
.arr{width:56px;height:22px;overflow:visible}
.ca-sub{text-align:center;margin:16px 0 0}
.ca-rows{display:flex;flex-direction:column;gap:30px;margin-top:22px;padding-top:26px;border-top:1px solid var(--line)}
.dots{display:block;width:100%;min-height:38px;text-align:center;font-family:var(--font-hand);font-size:18px;line-height:1.35;border:0;border-bottom:2.5px dotted color-mix(in srgb,var(--muted) 85%,transparent);background:transparent;resize:none;overflow:hidden;padding:4px 2px;outline:none;border-radius:0;color:var(--ink)}
.dots:focus{border-bottom-color:var(--accent)}
.ca-row .x{width:28px;height:28px}

/* Vision board */
.vbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.upl{cursor:pointer}
.upl-s{font-size:13.5px;color:var(--muted)}
.board{columns:2;column-gap:12px}
@media (min-width:760px){.board{columns:3}}
@media (min-width:1000px){.board{columns:4}}
.pin{position:relative;break-inside:avoid;display:block;margin:0 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 4px}
.pin img{display:block;width:100%;max-width:100%;height:auto;border-radius:8px;background:var(--sunk);min-height:60px}
.pin img.broken{min-height:130px}
.cap{display:block;width:100%;text-align:center;font-family:var(--font-hand);font-size:17px;line-height:1.3;border:0;background:transparent;resize:none;overflow:hidden;outline:none;padding:6px 2px 4px;color:var(--ink)}
.cap::placeholder{color:var(--muted);opacity:.7}
.pin-x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:0;background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--ink);display:grid;place-items:center;padding:0}
.pin-x svg{width:14px;height:14px}
.ov{position:absolute;inset:0;border-radius:12px;background:color-mix(in srgb,var(--surface) 94%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;text-align:center;font-weight:600}
.ov-b{display:flex;gap:12px;align-items:center}
.frames{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.frames{grid-template-columns:repeat(3,minmax(0,1fr))}}
.frame{aspect-ratio:4/5;max-width:100%;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;padding:12px;font-family:var(--font-hand);font-size:18px;line-height:1.3;color:var(--muted);cursor:pointer;background:var(--surface)}
.frame:hover{border-color:var(--accent);color:var(--accent-ink)}

/* Toast */
.toast{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:10px 12px 10px 16px;font-size:14px;box-shadow:0 8px 28px rgba(60,30,40,.25)}
.toast button{background:none;border:0;color:var(--line);font-weight:700;padding:6px 4px}
.warn{display:flex;gap:12px;align-items:flex-start;background:color-mix(in srgb,var(--red) 9%,var(--surface));border:1.5px solid color-mix(in srgb,var(--red) 45%,transparent);color:var(--ink);border-radius:14px;padding:12px 14px;margin-top:16px;font-size:14px;line-height:1.45}
.warn svg{width:22px;height:22px;flex:none;color:var(--red);margin-top:1px}
.warn b{display:block;font-size:15px;margin-bottom:2px}
.keep-tile{flex-direction:row;align-items:center;gap:14px;min-height:0;padding:16px;width:100%}
.keep-tile .gt{display:flex;flex-direction:column;gap:4px;min-width:0}
.keep-tile .tile-s{margin-top:0}
.bk-cards{display:grid;gap:14px;max-width:640px}
.bk-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.bk-card h3{margin:0;font-family:var(--font-display);font-weight:700;font-size:23px;line-height:1.15}
.bk-card p{margin:0;color:var(--muted)}
.bk-card p b{color:var(--ink)}
.bk-row{display:flex;flex-wrap:wrap;gap:10px}
.btn.ghost{background:transparent;color:var(--accent-ink);border:1.5px solid var(--accent);box-shadow:none}
textarea.in.code{font-family:ui-monospace,Menlo,Consolas,monospace;min-height:110px;max-height:240px;resize:vertical;overflow:auto;word-break:break-all}
.ok-note{color:var(--green);font-weight:600;font-size:14px}
.err-note{color:var(--red);font-weight:600;font-size:14px}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--sunk);border-radius:12px;padding:12px 14px}

/* Phone view: on a big screen the app sits in a phone-width column */
:root[data-layout="phone"] body{background:var(--sunk)}
:root[data-layout="phone"] #app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--paper);box-shadow:0 0 0 1px var(--line)}
:root[data-layout="phone"] .tiles.me,:root[data-layout="phone"] .tiles.new{grid-template-columns:repeat(2,minmax(0,1fr))}
:root[data-layout="phone"] .board{columns:2}
:root[data-layout="phone"] .frames{grid-template-columns:repeat(2,minmax(0,1fr))}
/* Computer view: a website layout with the sections listed on the side */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.main{min-width:0}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 28px;display:flex;flex-direction:column;gap:2px}
.side-brand{display:flex;align-items:center;gap:8px;padding:4px 10px 14px;font-family:var(--font-script);font-size:34px;line-height:1.1;color:var(--accent-ink);border:0;background:none;text-align:left}
.side-brand .ic{width:26px;height:26px;color:var(--shine)}
.side-h{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted);padding:16px 10px 6px}
.side-a{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:12px;padding:8px 10px;text-align:left;font-size:14.5px;font-weight:500;color:var(--ink)}
.side-a .ic{width:20px;height:20px;color:var(--accent);flex:none}
.side-a .arr{width:22px;height:12px;flex:none}
.side-a:hover{background:var(--sunk)}
.side-a[aria-current="page"]{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-ink);font-weight:600}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

function saveLocal(){
  clearTimeout(lsTimer);lsTimer=null;
  var snap=S;
  if(store.mode==='db'){snap=Object.assign({},S,{vision:S.vision.map(function(v){if(!v.src)return v;var c=Object.assign({},v);delete c.src;return c;})});}

var timers={},busy={},again={},retried={};
function persist(key){
  saveLocalSoon();
  if(!store.ready){dirty[key]=true;return;}
  if(store.mode!=='db'){setStatus(localStatus());return;}
  setStatus('saving');
  clearTimeout(timers[key]);
  timers[key]=setTimeout(function(){delete timers[key];flush(key);},600);
}
function bodyFor(key){
  if(key.indexOf('v-')===0){var v=S.vision.find(function(x){return x.id===key;});return v?clone(v):null;}
  return clone(S[key]);
}
function idle(){return !Object.keys(timers).length&&!Object.keys(busy).some(function(k){return busy[k];});}
function flush(key){
  if(busy[key]){again[key]=true;return;}
  busy[key]=true;
  var ref,body;
  try{ref=store.coll.doc(key);body=bodyFor(key);}catch(e){busy[key]=false;setStatus('err');return;}
  var p=body?ref.set(body):ref.delete();
  p.then(function(){
    retried[key]=0;busy[key]=false;
    if(key.indexOf('v-')===0){var v=S.vision.find(function(x){return x.id===key;});if(v)v.synced=true;}
    if(again[key]){again[key]=false;flush(key);return;}
    if(idle()&&store.status==='saving')setStatus('saved');
  },function(e){
    busy[key]=false;
    var code=e&&e.code;
    if(code==='unavailable'&&!retried[key]){retried[key]=1;setTimeout(function(){flush(key);},1200+Math.random()*800);return;}
    if(code==='quota_exceeded')setStatus('quota');
    else if(code==='revoked'||code==='not_granted'||code==='capability_disabled'||code==='capability_removed'){store.mode='local';saveLocal();setStatus('local');}
    else setStatus('err');
  });
}

function initCloud(){
  var tries=0;
  (function poll(){
    var c=window.claude;
    if(c&&typeof c.use==='function'){store.hadClaude=true;return connect(c);}
    if(++tries>15)return goLocal();
    setTimeout(poll,200);
  })();
}
function connect(c){
  var dbP=c.use('db'),userP=c.use('user'),assetsP=Promise.resolve(c.use('assets')).catch(function(){return null;});
  Promise.all([dbP,userP,assetsP]).then(function(r){
    var db=r[0],user=r[1],assets=r[2];
    if(!db||!user)return goLocal();
    return user.id().then(function(uid){
      if(!uid)return goLocal();
      var coll=db.collection('data/users/'+uid);
      return coll.get().then(function(snap){
        var before=JSON.stringify(S);
        var found={};
        snap.docs.forEach(function(d){if(d.exists)found[d.id]=d.data();});
        store.coll=coll;store.assets=assets||null;store.mode='db';
        var toWrite=[];
        SECTIONS.forEach(function(k){
          if(dirty[k])toWrite.push(k);
          else if(found[k])S[k]=merge(k,clone(found[k]));
          else if(JSON.stringify(S[k])!==JSON.stringify(DEF[k]))toWrite.push(k);
        });
        var cloud=Object.keys(found).filter(function(id){return id.indexOf('v-')===0;}).map(function(id){return Object.assign(clone(found[id]),{id:id,synced:true});});
        var ids={};cloud.forEach(function(v){ids[v.id]=1;});
        var localOnly=S.vision.filter(function(v){return !ids[v.id]&&!v.synced&&(v.src||v.assetId);});
        S.vision=cloud.concat(localOnly).sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0);});
        localOnly.forEach(function(v){toWrite.push(v.id);});
        store.ready=true;dirty={};
        if(JSON.stringify(S)!==before)render();
        if(toWrite.length){setStatus('saving');toWrite.forEach(flush);}else setStatus('saved');
        saveLocal();
      });
    });
  }).catch(function(){goLocal();});
}
function goLocal(){
  if(store.ready)return;
  store.mode='local';store.ready=true;
  if(Object.keys(dirty).length){dirty={};saveLocal();}
  setStatus(localStatus());
  if(noSaveHere())render();
}

  var arr=items.map(function(it,i){return {it:it,i:i};});
  if(c.check)arr.sort(function(a,b){return ((a.it.done?1:0)-(b.it.done?1:0))||(a.i-b.i);});
  var add='<form class="add" data-add="'+sec+'"><input id="add-'+sec+'" name="t" class="in" placeholder="'+esc(c.addPh)+'" autocomplete="off" aria-label="'+esc(c.addPh)+'"><button class="btn">Add</button></form>';
  var meta=c.check&&items.length?'<p class="meta"><b>'+items.filter(function(x){return x.done;}).length+' of '+items.length+'</b> '+c.doneWord+'</p>':'';
  var list=items.length?'<div class="list">'+arr.map(function(x){return itemHTML(sec,c,x.it,x.i);}).join('')+'</div>':'<div class="empty">'+esc(c.empty)+'</div>';
  var ideas=c.ideas&&items.length<3?ideasHTML(sec,c.ideas,items.map(function(x){return x.text;})):'';
  return '<div class="narrow">'+add+meta+list+ideas+'</div>';
}
function leadHTML(sec,c,it,i){
  if(c.check)return '<button class="check" data-act="toggle" data-sec="'+sec+'" data-id="'+it.id+'" aria-pressed="'+!!it.done+'" aria-label="Mark as '+c.doneWord+'">'+ICON.check+'</button>';
  if(c.numbered)return '<span class="num" aria-hidden="true">'+roman(i+1)+'</span>';
  if(c.book)return '<span class="bk" style="--bc:var(--book'+(hash(it.id)%6+1)+')" aria-hidden="true">'+esc(((it.text||'').trim()[0]||'·').toUpperCase())+'</span>';
  if(c.days){var d=parseISO(it.date);return d?'<span class="dblk" aria-hidden="true"><b>'+d.getDate()+'</b><span>'+MONTHS[d.getMonth()].slice(0,3)+'</span></span>':'<span class="dblk" aria-hidden="true">'+ICON.heart+'</span>';}
  return '<span class="bullet" aria-hidden="true"></span>';
}
function fieldHTML(sec,it,f){
  var a='data-sec="'+sec+'" data-id="'+it.id+'" data-k="'+f.k+'"';
  if(f.type==='date')return '<label class="f-date"><span>'+f.label+'</span><input type="date" class="f" '+a+(f.re?' data-re="1"':'')+' value="'+esc(it[f.k]||'')+'"></label>';
  if(f.type==='line')return '<input class="f f-line" '+a+' value="'+esc(it[f.k]||'')+'" placeholder="'+esc(f.ph)+'" aria-label="'+esc(f.ph)+'">';
  return '<textarea class="f f-note grow" rows="1" '+a+' placeholder="'+esc(f.ph)+'" aria-label="'+esc(f.ph)+'">'+esc(it[f.k]||'')+'</textarea>';
}
function itemHTML(sec,c,it,i){
  return '<div class="item'+(c.check&&it.done?' done':'')+'">'+leadHTML(sec,c,it,i)+
    '<div class="item-main"><textarea class="f f-main grow" rows="1" data-sec="'+sec+'" data-id="'+it.id+'" data-k="text" aria-label="'+esc(c.label)+'">'+esc(it.text)+'</textarea>'+
    c.fields.map(function(f){return fieldHTML(sec,it,f);}).join('')+'</div>'+
    '<button class="x" data-act="del" data-sec="'+sec+'" data-id="'+it.id+'" aria-label="Remove">'+ICON.x+'</button></div>';
}

function habitCard(h){
  var days=[];for(var i=0;i<30;i++)days.push(!!(h.days&&h.days[i]));
  var done=days.filter(Boolean).length;
  var st=parseISO(h.start),ti=st?daysBetween(st,parseISO(todayISO()))+1:0;
  var meta=ti<1?'starts in '+plural(1-ti,'day'):ti<=30?'day '+ti+' of 30 today':'30 days are over';
  var conf=ui.confirm==='h:'+h.id;
  return '<article class="habit">'+
    '<div class="habit-top"><div class="habit-id"><textarea class="f f-main grow" rows="1" data-sec="habit" data-id="'+h.id+'" data-k="name" aria-label="Habit name">'+esc(h.name)+'</textarea>'+
      '<div class="habit-meta"><label>Started <input type="date" class="f" data-sec="habit" data-id="'+h.id+'" data-k="start" data-re="1" value="'+esc(h.start)+'"></label><span>· '+meta+'</span></div></div>'+
      '<div class="habit-count" aria-label="'+done+' of 30 days done"><b>'+done+'</b><span>/30</span></div></div>'+
    '<div class="bar"><i style="width:'+(done/30*100).toFixed(1)+'%"></i></div>'+
    '<div class="boxes">'+days.map(function(on,n){return '<button class="box'+(on?' on':'')+(n+1===ti?' today':'')+'" data-act="box" data-id="'+h.id+'" data-n="'+n+'" aria-pressed="'+on+'" aria-label="Day '+(n+1)+'">'+(on?ICON.heartFill:(n+1))+'</button>';}).join('')+'</div>'+
    (done===30?'<p class="won">30 out of 30. This habit is part of you now.</p>':'')+
    '<div class="habit-foot">'+(conf?'<span>Delete this habit and its 30 days?</span><button class="btn sm danger" data-act="rmhabit" data-id="'+h.id+'">Delete</button><button class="link" data-act="cancel">Keep</button>':'<button class="link" data-act="ask" data-key="h:'+h.id+'">Delete habit</button>')+'</div>'+
  '</article>';
}

function typeInfo(id,fallback){

function backupJSON(){return JSON.stringify({app:'my-new-era',version:1,savedAt:new Date().toISOString(),data:S});}
function saveBackupFile(){
  var name='my-new-era-backup-'+todayISO()+'.json';
  var c=window.claude;
  if(c&&typeof c.use==='function'){
    Promise.resolve(c.use('downloads')).then(function(dl){
      if(!dl)throw {code:'unavailable'};
      return dl.save({filename:name,data:new Blob([backupJSON()],{type:'application/json'})});
    }).then(function(){markBackup();ui.bkCode='';ui.bkMsg='Backup saved as "'+name+'". Keep it somewhere safe.';render();},
    function(e){if(e&&e.code==='declined')return;ui.bkMsg='';ui.bkCode=backupJSON();render();});
    return;
  }
  try{
    var blob=new Blob([backupJSON()],{type:'application/json'});
    var url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},5000);
    markBackup();ui.bkCode='';
    ui.bkMsg='Check your downloads for "'+name+'". If it is not there, use Copy backup code.';
  }catch(e){ui.bkMsg='';ui.bkCode=backupJSON();}
  render();
}
function copyBackup(){
  var code=backupJSON();
  function done(){markBackup();ui.bkCode='';ui.bkMsg='Backup code copied. Paste it in your notes to keep it.';render();}
  function fallback(){ui.bkMsg='';ui.bkCode=code;render();var t=$('#bk-code');if(t){t.focus();t.select();}}
  try{navigator.clipboard.writeText(code).then(done,fallback);}catch(e){fallback();}
}
function readBackup(text){
  var o;try{o=JSON.parse(String(text||'').trim());}catch(e){return null;}
  if(!o||typeof o!=='object')return null;
  var d=o.app==='my-new-era'&&o.data&&typeof o.data==='object'?o.data:null;
  if(!d)return null;
  var w=o.savedAt?new Date(o.savedAt):null;
  return {data:d,when:w&&!isNaN(w)?fmtLong(w):'your backup'};
}
function askRestore(text){
  var r=readBackup(text);
  ui.restore=r;ui.bkErr=r?'':'This is not a My New Era backup. Check that you copied all of it.';
  render();
}
function doRestore(){
  var r=ui.restore;if(!r)return;
  var fresh=defaults(),oldVision=S.vision;
  Object.keys(fresh).forEach(function(k){if(r.data[k]!==undefined)fresh[k]=merge(k,clone(r.data[k]));});
  S=fresh;upgradeRoutine();upgradeCareer();
  S.vision.forEach(function(v){v.synced=false;});
  ui.restore=null;ui.bkErr='';ui.bkMsg='';
  var ok=saveLocal();
  if(store.mode==='db'){
    SECTIONS.forEach(function(k){persist(k);});
    S.vision.forEach(function(v){persist(v.id);});
    oldVision.forEach(function(v){if(!S.vision.some(function(x){return x.id===v.id;}))persist(v.id);});
  }else setStatus(ok?localStatus():(storageOK?'full':'nosave'));
  render();
  toast(ok||store.mode==='db'?'Everything is back.':(storageOK?'Restored, but this device is out of space. Remove a picture to save.':'Restored for now, but this view does not save.'));
}

var BUILD={backup:backupHTML,about:aboutHTML,routine:routineHTML,vision:visionHTML,habit:habitHTML,wishlist:wishHTML,career:careerHTML,hobbies:hobbiesHTML,challenges:caHTML};

/* ---------- Actions ---------- */
var toastEl=$('#toast'),toastT=null;
function toast(msg,undo){
  toastEl.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button type="button" id="toast-undo">Undo</button>':'');
  toastEl.hidden=false;
  if(undo)$('#toast-undo').onclick=function(){toastEl.hidden=true;undo();};
  clearTimeout(toastT);toastT=setTimeout(function(){toastEl.hidden=true;},undo?6000:3500);
}
function newListItem(sec,t){var c=LISTS[sec],it={id:rid(),text:t};if(c.check)it.done=false;c.fields.forEach(function(f){it[f.k]='';});return it;}
function newHabit(t){return {id:rid(),name:t,start:todayISO(),days:[].concat(new Array(30).fill(false))};}
function delItem(sec,id){
  var arr=S[sec].items,i=arr.findIndex(function(x){return x.id===id;});if(i<0)return;
  var it=arr.splice(i,1)[0];persist(sec);render();
  toast('Removed',function(){var a=S[sec].items;a.splice(Math.min(i,a.length),0,it);persist(sec);render();});
}

app.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');
  if(g){e.preventDefault();go(g.dataset.go);return;}
  var b=e.target.closest('[data-act]');if(!b)return;
  var d=b.dataset,act=d.act,it;
  if(act==='toggle'){
    it=S[d.sec].items.find(function(x){return x.id===d.id;});
    if(it){var f=TOGGLE[d.sec];it[f]=!it[f];persist(d.sec);render();}
  }else if(act==='del'){delItem(d.sec,d.id);}
  else if(act==='idea'){
    if(d.sec==='habit'){S.habit.items.unshift(newHabit(d.text));}
    else S[d.sec].items.push(newListItem(d.sec,d.text));
    persist(d.sec);render();
  }else if(act==='today'){
    it=S.routine.items.find(function(x){return x.id===d.id;});
    if(it){var t=todayISO();it.done=it.done===t?'':t;persist('routine');render();}
  }else if(act==='addslot'){
    var last=S.routine.items.reduce(function(m,x){var v=toMin(x.time);return v==null?m:Math.max(m,v);},270);
    var nm=Math.min(last+30,23*60+30),id='s'+rid();
    S.routine.items.push({id:id,time:pad(Math.floor(nm/60))+':'+pad(nm%60),text:'',done:''});
    persist('routine');pendingFocus='textarea[data-id="'+id+'"]';render();
  }else if(act==='box'){
    it=S.habit.items.find(function(x){return x.id===d.id;});
    if(it){if(!Array.isArray(it.days))it.days=[];for(var k=0;k<30;k++)it.days[k]=!!it.days[k];var n=+d.n;it.days[n]=!it.days[n];persist('habit');render();}
  }else if(act==='bkfile'){saveBackupFile();}
  else if(act==='bkcopy'){copyBackup();}
  else if(act==='bkpaste'){var pt=$('#bk-paste');askRestore(pt?pt.value:'');}
  else if(act==='dorestore'){doRestore();}
  else if(act==='norestore'){ui.restore=null;render();}
  else if(act==='addtype'){ui.addingType=true;pendingFocus='#ctype-in';render();}
  else if(act==='canceltype'){ui.addingType=false;render();}
  else if(act==='rmtype'){
    if(!S.career.items.some(function(x){return x.type===d.id;})){S.career.types=S.career.types.filter(function(x){return x.id!==d.id;});if(ui.lastType===d.id)ui.lastType='training';persist('career');render();}
  }else if(act==='layout'){setLayout(layout==='computer'?'phone':'computer');render();window.scrollTo(0,0);}
  else if(act==='theme'){setTheme(curTheme()==='dark'?'light':'dark');render();}
  else if(act==='ask'){ui.confirm=d.key;render();}
  else if(act==='cancel'){ui.confirm=null;render();}
  else if(act==='rmhabit'){
    S.habit.items=S.habit.items.filter(function(x){return x.id!==d.id;});ui.confirm=null;persist('habit');render();toast('Habit deleted');
  }else if(act==='rmimg'){removeImage(d.id);}
  else if(act==='newcat'){
    ui.newCat=d.v;$$('.seg-b',b.parentElement).forEach(function(x){var on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-checked',on);});
  }else if(act==='newstar'){
    ui.newStars=+d.n;paintStars(b.parentElement,ui.newStars);var w=$('#star-word');if(w)w.textContent=STARWORD[ui.newStars];
  }else if(act==='star'){
    it=S.wishlist.items.find(function(x){return x.id===d.id;});
    if(it){it.stars=+d.n;persist('wishlist');paintStars(b.parentElement,it.stars);}
  }else if(act==='wf'){ui.wf=d.v;render();}
  else if(act==='year'){ui.year+=(+d.d);render();}
  else if(act==='thisyear'){ui.year=new Date().getFullYear();render();}
  else if(act==='hobbydone'){
    var M=S.hobbies.months,o=M[d.m]||(M[d.m]={name:'',note:'',done:false});o.done=!o.done;persist('hobbies');render();
  }else if(act==='addca'){
    var cid='c'+rid();S.challenges.items.push({id:cid,c:'',a:'',achieved:false});persist('challenges');pendingFocus='textarea[data-id="'+cid+'"]';render();
  }
});

app.addEventListener('submit',function(e){
  var f=e.target;if(!f.matches('form[data-add]'))return;e.preventDefault();
  var sec=f.dataset.add,t=(f.elements.t.value||'').trim();
  if(!t){f.elements.t.focus();return;}
  if(LISTS[sec]){S[sec].items.push(newListItem(sec,t));pendingFocus='#add-'+sec;}
  else if(sec==='habit'){S.habit.items.unshift(newHabit(t));}
  else if(sec==='wishlist'){
    var note=(f.elements.note.value||'').trim();
    S.wishlist.items.push({id:rid(),text:t,note:note,stars:ui.newStars,cat:ui.newCat,bought:false});
    if(ui.wf!=='all'&&ui.wf!==ui.newCat)ui.wf='all';
    ui.newStars=3;pendingFocus='#wish-name';
  }else if(sec==='ctype'){
    var lab=t.slice(0,40),ex=S.career.types.filter(function(y){return y.label.toLowerCase()===lab.toLowerCase();})[0];
    if(!ex){ex={id:'u'+rid(),label:lab};S.career.types.push(ex);}
    ui.addingType=false;ui.lastType=ex.id;sec='career';
  }else if(sec==='career'){
    var m=f.dataset.m,tv=f.elements.type.value,ti=typeInfo(tv),task={id:rid(),month:m,type:tv,text:t,done:false};
    if(ti[3])task.label=ti[1];
    ui.lastType=tv;
    S.career.items.push(task);
    pendingFocus='form[data-m="'+m+'"] input[name="t"]';
  }
  persist(sec);render();
});

function setPath(o,k,v){var p=k.split('.');for(var i=0;i<p.length-1;i++){o=o[p[i]];if(o==null)return;}o[p[p.length-1]]=v;}
app.addEventListener('input',function(e){
  var t=e.target,d=t.dataset;if(!d||!d.sec)return;
  if(t.tagName==='TEXTAREA')grow(t);
  var v=t.value;
  if(d.sec==='vision'){var vi=S.vision.find(function(x){return x.id===d.id;});if(vi){vi.caption=v;persist(vi.id);}return;}
  if(d.sec==='hobbies'){var M=S.hobbies.months,o=M[d.m]||(M[d.m]={name:'',note:'',done:false});o[d.k]=v;persist('hobbies');return;}
  var obj=d.id?S[d.sec].items.find(function(x){return x.id===d.id;}):S[d.sec];
  if(!obj)return;
  setPath(obj,d.k,v);persist(d.sec);
  if(d.sec==='wishlist'&&d.k==='cat'){var card=t.closest('.wish');if(card)card.style.setProperty('--c','var(--'+v+')');}
});
app.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='bk-file'){var fl=t.files&&t.files[0];t.value='';if(fl){var rd=new FileReader();rd.onload=function(){askRestore(rd.result);};rd.onerror=function(){ui.restore=null;ui.bkErr='This file could not be opened. Try again, or paste the backup code.';render();};rd.readAsText(fl);}return;}
  if(t.id==='vis-file'){var files=t.files;if(files&&files.length)addImages(Array.prototype.slice.call(files));t.value='';return;}
  if(t.dataset&&t.dataset.re)render();
});
document.addEventListener('error',function(e){var t=e.target;if(t&&t.tagName==='IMG')t.classList.add('broken');},true);

/* ---------- Pictures ---------- */
function readImage(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){res(im);setTimeout(function(){URL.revokeObjectURL(url);},1000);};
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('read'));};
    im.src=url;
  });
}
function drawScaled(im,max){
  var w0=im.naturalWidth||im.width,h0=im.naturalHeight||im.height,s=Math.min(1,max/Math.max(w0,h0));
  var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w0*s));c.height=Math.max(1,Math.round(h0*s));
  var x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return c;
}
function canvasBlob(c,q){return new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error('blob'));},'image/jpeg',q);});}
function smallDataUrl(im){
  var steps=[[1000,.72],[860,.62],[720,.55],[560,.5]];
  for(var i=0;i<steps.length;i++){var u=drawScaled(im,steps[i][0]).toDataURL('image/jpeg',steps[i][1]);if(u.length<185000)return u;}
  return drawScaled(im,420).toDataURL('image/jpeg',.5);
}
function addImages(files){
  files=files.filter(function(f){return !f.type||f.type.indexOf('image/')===0;});
  if(!files.length)return;
  ui.uploading+=files.length;if(view==='vision')render();
  var failed=0;
  files.reduce(function(chain,f){
    return chain.then(function(){
      return readImage(f).then(function(im){
        var item={id:'v-'+rid(),caption:'',createdAt:Date.now()};
        var up=(store.mode==='db'&&store.assets)?canvasBlob(drawScaled(im,1600),.85).then(function(blob){return store.assets.upload(blob,{type:'image/jpeg'});}).then(function(r){if(r&&r.id)item.assetId=r.id;}).catch(function(){}):Promise.resolve();
        return up.then(function(){if(!item.assetId)item.src=smallDataUrl(im);S.vision.push(item);persist(item.id);});
      }).catch(function(){failed++;}).then(function(){ui.uploading--;if(view==='vision')render();});
    });
  },Promise.resolve()).then(function(){
    if(failed)toast(failed===1?'One picture could not be read. Try a JPG or PNG.':failed+' pictures could not be read. Try JPG or PNG.');
  });
}
function removeImage(id){
  var v=S.vision.find(function(x){return x.id===id;});if(!v)return;
  S.vision=S.vision.filter(function(x){return x!==v;});ui.confirm=null;persist(id);render();
  if(v.assetId&&store.assets){Promise.resolve().then(function(){return store.assets.delete(v.assetId);}).catch(function(){});}
}

window.addEventListener('resize',function(){clearTimeout(rT);rT=setTimeout(function(){$$('textarea.grow,textarea.dots,textarea.cap',app).forEach(grow);},150);});

initCloud();
